  <style>
/* LA Life — UI in the language of Caltrans guide signs: freeway green, white inset border, Highway-Gothic-like type. */
:root {
  --sign: #006B4F;          /* freeway guide-sign green */
  --sign-deep: #00523C;
  --white: #FFFFFF;
  --gold: #F2C230;          /* money, waypoints */
  --red: #E3131B;           /* Metro B line red: warnings */
  --blue: #1F6FB2;          /* Pacific blue: city channel */
  --asphalt: #262A2F;       /* phone & chat */
  --ink: #17231D;
  --ok: #3ECF8E;
  --font: "Overpass", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b24; font-family: var(--font); color: var(--white); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; image-rendering: pixelated; }
#hud { position: fixed; inset: 0; pointer-events: none; display: none; }
body.playing #hud { display: block; }
#hud > * { pointer-events: auto; }
[hidden] { display: none !important; }

/* ---------- sign primitives ---------- */
.sign, #loc, #activity, .title-sign {
  background: var(--sign); border: 2.5px solid var(--white); border-radius: 10px;
  box-shadow: 0 0 0 4px var(--sign), 0 14px 34px rgba(0, 0, 0, .38);
}
.exit-tab {
  position: absolute; top: -27px; right: 18px; padding: 3px 14px 1px; font-weight: 800; font-size: 14px; color: var(--white);
  background: var(--sign); border: 2.5px solid var(--white); border-bottom: 0; border-radius: 7px 7px 0 0;
  box-shadow: 0 -4px 0 0 var(--sign), 4px 0 0 0 var(--sign), -4px 0 0 0 var(--sign);
}
.exit-tab:hover { background: var(--white); color: var(--sign); }

/* ---------- HUD ---------- */
#loc { position: fixed; top: 16px; left: 16px; padding: 7px 16px 6px; display: flex; flex-direction: column; min-width: 150px; }
#loc-name { font-weight: 900; font-size: 22px; line-height: 1.05; letter-spacing: .01em; }
#clock { font-weight: 600; font-size: 14px; opacity: .92; font-variant-numeric: tabular-nums; margin-top: 2px; }
#topright { position: fixed; top: 18px; right: 16px; display: flex; gap: 8px; align-items: center; }
#money { background: var(--gold); color: var(--ink); font-weight: 900; font-size: 20px; padding: 7px 14px 5px; border-radius: 8px; border: 2.5px solid var(--ink); font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }
#money.neg { background: var(--red); color: var(--white); }
#topright button { width: 44px; height: 44px; border-radius: 10px; border: 2.5px solid var(--white); background: var(--sign); font-size: 20px; box-shadow: 0 0 0 3px var(--sign); }
#topright button:hover { background: var(--sign-deep); }

#activity { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 10px 8px 16px; display: flex; gap: 12px; align-items: center; min-width: 300px; max-width: min(560px, 60vw); }
.act-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.act-text strong { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-text small { font-size: 12px; opacity: .85; }
.act-text em { font-style: normal; color: var(--gold); font-weight: 800; font-size: 13px; }
#activity .bar { width: 110px; }
#activity button { background: var(--white); color: var(--sign); font-weight: 800; border: 0; border-radius: 6px; padding: 6px 12px 4px; }

.bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.bar s { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width .4s; }
.bar.low s { background: var(--gold); } .bar.crit s { background: var(--red); } .bar.skill s { background: #7FB6FF; }

#toasts { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none !important; width: min(520px, 92vw); }
.toast { background: var(--asphalt); border-left: 5px solid var(--white); padding: 8px 14px 6px; border-radius: 6px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); transition: opacity .5s, transform .5s; max-width: 100%; }
.toast.ok { border-color: var(--ok); } .toast.err { border-color: var(--red); background: #3a1d20; }
.toast.out { opacity: 0; transform: translateY(-6px); }

#prompt { position: fixed; bottom: 26%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: var(--white); color: var(--sign); border: 0; border-radius: 8px; padding: 6px 14px 4px 6px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
#prompt kbd { background: var(--sign); color: var(--white); border-radius: 5px; padding: 3px 9px 1px; font-family: var(--font); font-weight: 900; }

#needs { position: fixed; right: 16px; bottom: 16px; background: rgba(23, 35, 29, .86); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; width: 176px; }
.need { display: flex; align-items: center; gap: 8px; }
.need i { font-style: normal; width: 20px; text-align: center; font-size: 15px; }
.need b { flex: 1; height: 9px; background: rgba(255, 255, 255, .16); border-radius: 5px; overflow: hidden; }
.need s { display: block; height: 100%; background: var(--ok); transition: width .5s; }
.need.low s { background: var(--gold); } .need.crit s { background: var(--red); }
.need.crit i { animation: throb 1s infinite; }
@keyframes throb { 50% { transform: scale(1.3); } }

#chat { position: fixed; left: 16px; bottom: 16px; width: min(360px, 44vw); display: flex; flex-direction: column; background: rgba(23, 35, 29, .78); border-radius: 10px; overflow: hidden; }
.chat-tabs { display: flex; gap: 2px; padding: 6px 6px 0; }
.chat-tabs button { border: 0; background: transparent; color: rgba(255, 255, 255, .6); font-weight: 800; font-size: 13px; padding: 4px 10px 2px; border-radius: 6px 6px 0 0; }
.chat-tabs button.on { background: rgba(255, 255, 255, .12); color: var(--white); }
#chat-log { height: 150px; overflow-y: auto; padding: 6px 10px; font-size: 13.5px; line-height: 1.4; scrollbar-width: thin; }
.msg { margin: 2px 0; word-break: break-word; }
.msg b { color: #9FE3C4; margin-right: 6px; font-weight: 800; }
.msg i { font-style: normal; background: var(--blue); border-radius: 4px; padding: 0 5px; font-size: 11px; margin-right: 5px; font-weight: 800; }
.msg.news span { color: var(--gold); font-weight: 600; }
#chat-input { border: 0; border-top: 1px solid rgba(255, 255, 255, .12); background: rgba(0, 0, 0, .25); color: var(--white); padding: 9px 10px; font: inherit; font-size: 14px; }
#chat-input::placeholder { color: rgba(255, 255, 255, .5); }
#joy { display: none; position: fixed; left: 28px; bottom: 210px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .4); touch-action: none; }
#joy i { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
@media (pointer: coarse) { #joy { display: block; } #prompt { bottom: 30%; font-size: 17px; padding: 10px 16px 8px 10px; } }

/* ---------- modal & sign panels ---------- */
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 18, 14, .35); padding: 40px 12px 12px; }
.sign { position: relative; width: min(560px, 96vw); max-height: min(78vh, 760px); display: flex; flex-direction: column; }
.sign-head { padding: 14px 20px 8px; display: flex; justify-content: space-between; align-items: flex-start; }
.sign-head h2 { margin: 0; font-size: 26px; font-weight: 900; line-height: 1.1; }
.sign-head p { margin: 3px 0 0; font-weight: 600; opacity: .85; font-size: 14px; }
.sign-body { overflow-y: auto; padding: 4px 20px 18px; scrollbar-width: thin; }
.sign h3, .app h3 { margin: 16px 0 6px; font-size: 15px; font-weight: 800; padding-bottom: 4px; border-bottom: 2px solid rgba(255, 255, 255, .35); }
.lead { font-size: 15px; line-height: 1.5; margin: 6px 0 10px; }
.note { font-size: 13px; line-height: 1.5; opacity: .82; margin: 8px 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, .13); }
.row.mine { background: rgba(255, 255, 255, .08); border-radius: 6px; padding: 8px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-main > span { font-weight: 700; font-size: 15px; }
.row-main small { font-size: 12.5px; opacity: .78; margin-top: 2px; }
.row-btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.eff { font-size: 12px; letter-spacing: 1px; }
.price { font-style: normal; color: var(--gold); font-weight: 900; font-variant-numeric: tabular-nums; }
.price.free { color: var(--ok); }
.sign button, .app button, .phone button:not(.exit-tab):not(.back) { background: var(--white); color: var(--sign); border: 0; border-radius: 6px; padding: 6px 12px 4px; font-weight: 800; font-size: 14px; }
.sign button.ghost, .app button.ghost { background: transparent; color: var(--white); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .7); }
.sign button.wide, .app button.wide { display: block; width: 100%; margin: 10px 0 0; padding: 10px; }
.sign button.sm, .app button.sm { padding: 2px 8px; font-size: 12px; }
.sign .exit-tab { background: var(--sign); color: var(--white); border-radius: 7px 7px 0 0; padding: 3px 14px 1px; }
.sign .exit-tab:hover { background: var(--white); color: var(--sign); }
input[type=number], input[type=text], select { width: 92px; background: rgba(255, 255, 255, .95); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 8px 4px; font: inherit; font-weight: 700; font-size: 14px; }
input[type=text] { width: 140px; }
select { width: auto; max-width: 110px; }
.clothes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 6px 0; }
.fit-mirror { display: flex; justify-content: center; margin: 2px 0 6px; } .fit-mirror canvas { width: 120px; height: 152px; border-radius: 14px; background: linear-gradient(#eef6f8, #dfeaee); }
.cloth { background: rgba(0, 0, 0, .18); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.cloth.on { box-shadow: inset 0 0 0 2px var(--gold); }
.cloth i { width: 30px; height: 18px; border-radius: 4px; border: 2px solid var(--white); }
.cloth i.none { background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255, 255, 255, .5) 4px 6px); }
.cloth span { font-weight: 700; font-size: 13px; }
.cloth small { color: var(--gold); font-weight: 800; }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sign .type, .app .type { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left; padding: 10px; }
.type small { font-weight: 600; opacity: .8; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin: 8px 0; }
.stats div { background: rgba(0, 0, 0, .2); border-radius: 8px; padding: 8px 10px 6px; display: flex; flex-direction: column; }
.stats small { font-size: 12px; opacity: .75; }
.stats b { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.up { color: var(--ok); } .down { color: #FF8A7A; }
.danger { margin-top: 14px; }
.emotes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.sign .emotes button { display: flex; flex-direction: column; align-items: center; font-size: 22px; padding: 6px 2px; }
.emotes small { font-size: 11px; }
.line { display: inline-block; min-width: 22px; text-align: center; border-radius: 50%; color: #fff; font-weight: 900; font-size: 13px; padding: 3px 0 1px; margin-right: 4px; border: 2px solid #fff; }
.line.sm { min-width: 18px; font-size: 11px; padding: 1px 0 0; }
.sign.metro { --sign: #1B1C20; }

/* ---------- phone ---------- */
.phone { position: relative; width: min(390px, 96vw); height: min(700px, 86vh); background: var(--asphalt); border-radius: 30px; border: 6px solid #111417; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); display: flex; flex-direction: column; overflow: visible; }
.phone-top { display: flex; align-items: center; gap: 10px; padding: 14px 18px 8px; font-weight: 800; position: relative; }
.phone-top b { font-size: 18px; flex: 1; }
.phone-top span { flex: 1; font-variant-numeric: tabular-nums; }
.phone .exit-tab { top: -32px; }
.back { background: transparent; border: 0; font-size: 28px; line-height: 1; padding: 0 6px; color: var(--white); }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 18px; }
.phone .apps button { position: relative; background: transparent; color: var(--white); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; font-weight: 700; font-size: 13px; }
.apps i { font-style: normal; font-size: 30px; width: 68px; height: 68px; display: grid; place-items: center; border-radius: 18px; background: var(--sign); border: 2px solid rgba(255, 255, 255, .85); }
.apps em { position: absolute; top: -4px; right: 14px; background: var(--red); border-radius: 10px; font-style: normal; font-size: 12px; padding: 1px 6px; }
.app { padding: 4px 18px 18px; flex: 1; }
.app .row-main > span { font-size: 14.5px; }
.kv { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-top: 8px; margin-bottom: 4px; }
.me-card { display: flex; gap: 14px; align-items: center; }
.me-card canvas { image-rendering: pixelated; background: rgba(255, 255, 255, .06); border-radius: 12px; }
.me-card h3 { border: 0; margin: 0 0 4px; font-size: 20px; }
.me-card p { margin: 2px 0; font-size: 13.5px; }
.mine-card { background: rgba(0, 107, 79, .45); border: 2px solid rgba(255, 255, 255, .5); border-radius: 10px; padding: 4px 12px 12px; margin-bottom: 10px; }
.mine-card p { margin: 4px 0; font-size: 13.5px; }
.job { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.job > div:first-child { display: flex; flex-direction: column; }
.job small { opacity: .75; font-size: 12.5px; }
.wheres { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.app button.chip { background: rgba(255, 255, 255, .1); color: var(--white); font-size: 12px; padding: 4px 9px 2px; font-weight: 700; }
.app button.stock { display: flex; align-items: center; gap: 10px; width: 100%; background: rgba(255, 255, 255, .05); color: var(--white); margin: 6px 0; padding: 10px 12px; text-align: left; border-radius: 10px; }
.stock > div:first-child { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.stock small { font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock .px { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.stock .px small { opacity: 1; }
.big-price b { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; margin-right: 8px; }
.spark { display: block; }
.big-price + .spark { width: 100%; height: auto; margin: 8px 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #6b7078; margin-right: 7px; vertical-align: 1px; }
.dot.on { background: var(--ok); }
.dm-log { height: calc(100% - 52px); min-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 6px 0; }
.dm { align-self: flex-start; max-width: 80%; background: rgba(255, 255, 255, .1); padding: 7px 11px 5px; border-radius: 14px 14px 14px 4px; font-size: 14px; }
.dm.mine { align-self: flex-end; background: var(--sign); border-radius: 14px 14px 4px 14px; }
.dm small { display: block; font-size: 10.5px; opacity: .6; }
.dm-send { display: flex; gap: 6px; } .dm-send input { flex: 1; width: auto; }
.map-wrap { margin: 0 -12px; } #minimap { width: 100%; border-radius: 10px; cursor: crosshair; image-rendering: pixelated; }
.biz { margin-bottom: 16px; }
.biz h3 { display: flex; justify-content: space-between; align-items: center; }

/* ---------- sign in ---------- */

    linear-gradient(180deg, #2E3A7A 0%, #8A4C8F 38%, #F06C6B 64%, #FFB36B 84%, #FFD98A 100%);
}
.auth-card { width: min(460px, 100%); display: flex; flex-direction: column; position: relative; margin-bottom: 18vh; }
.title-sign { display: flex; gap: 16px; align-items: center; padding: 16px 20px; margin-bottom: 18px; }
.title-sign h1 { margin: 0; font-size: 40px; font-weight: 900; line-height: 1; }
.title-sign p { margin: 6px 0 0; font-weight: 600; font-size: 14px; line-height: 1.35; }
.shield { flex: none; width: 58px; height: 62px; background: var(--white); color: var(--sign); font-weight: 900; font-size: 24px; display: grid; place-items: center; border-radius: 10px 10px 28px 28px; border: 3px solid var(--sign); box-shadow: 0 0 0 2.5px var(--white); padding-top: 4px; }
.lang-switch { position: absolute; top: -6px; right: 0; display: flex; gap: 4px; }
.lang-switch button { background: rgba(0, 0, 0, .3); border: 0; color: var(--white); border-radius: 6px; padding: 3px 9px 1px; font-weight: 800; font-size: 12px; }
.lang-switch button.on { background: var(--white); color: var(--sign); }
.auth-card label { font-weight: 800; font-size: 14px; margin: 10px 0 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.auth-card input { width: 100%; padding: 11px 12px 9px; border-radius: 8px; border: 2.5px solid var(--white); background: rgba(255, 255, 255, .96); color: var(--ink); font: inherit; font-weight: 700; font-size: 16px; }
.creator { display: flex; gap: 16px; background: rgba(23, 35, 29, .72); border-radius: 12px; padding: 14px; align-items: center; }
.creator canvas { image-rendering: pixelated; flex: none; background: radial-gradient(circle at 50% 70%, rgba(255, 255, 255, .25), transparent 65%); border-radius: 10px; }
.opts { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.opts label { margin: 6px 0 4px; font-size: 13px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); padding: 0; }
.sw button.num { background: rgba(255, 255, 255, .15); color: var(--white); font-weight: 800; font-size: 13px; }
.sw button.wide { width: auto; border-radius: 13px; padding: 0 12px; }
.sw button.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.auth-err { color: #fff; background: var(--red); border-radius: 6px; font-weight: 700; padding: 0 10px; margin: 10px 0 0; min-height: 0; }
.auth-err:empty { display: none; }
.auth-err:not(:empty) { padding: 6px 10px 4px; }
.go { margin-top: 16px; background: var(--white); color: var(--sign); border: 0; border-radius: 8px; padding: 13px 10px 10px; font-weight: 900; font-size: 18px; box-shadow: 0 0 0 3px var(--sign), 0 0 0 5.5px var(--white); }
.go:disabled { opacity: .6; }
.switch { margin-top: 14px; background: transparent; border: 0; color: var(--white); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 720px) {
  #loc-name { font-size: 17px; } #loc { min-width: 0; padding: 5px 12px 4px; top: 10px; left: 10px; }
  #topright { top: 10px; right: 10px; } #money { font-size: 16px; min-width: 0; padding: 6px 10px 4px; }
  #topright button { width: 38px; height: 38px; font-size: 17px; }
  #loc { max-width: calc(100vw - 262px); } #loc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* long place names never run under the coin pill */
  #needs { width: 132px; padding: 8px; gap: 4px; right: 10px; bottom: 10px; }
  #chat { width: 56vw; left: 10px; bottom: 10px; } #chat-log { height: 86px; font-size: 12.5px; }
  #activity { top: 62px; min-width: 0; width: 92vw; }
  #toasts { top: 120px; }
  .sign-head h2 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- 3D world overlays ---------- */
#game canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.tag-name { font: 800 12px var(--font); color: #fff; white-space: nowrap; text-shadow: 0 1px 2px rgba(0, 0, 0, .85), 0 0 6px rgba(0, 0, 0, .45); letter-spacing: .01em; }
.tag-name.me { color: var(--gold); }
.tag-emote { font-size: 22px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35)); }
.tag-bubble { position: relative; background: #fff; color: var(--ink); font: 700 13px/1.35 var(--font); padding: 6px 10px 4px; border-radius: 12px; max-width: 200px; width: max-content; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); margin-bottom: 10px; word-break: break-word; }
.tag-bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
#wp-arrow { position: fixed; left: 0; top: 0; margin: -18px 0 0 -18px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--gold); font-size: 30px; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); pointer-events: none; }

/* ---------- life checklist ---------- */
#goal { position: fixed; top: 86px; left: 16px; max-width: min(320px, 60vw); text-align: left; font: inherit; font-weight: 800; font-size: 13px; line-height: 1.25;
  color: var(--ink); background: var(--white); border: 0; border-radius: 8px; padding: 7px 11px 6px; box-shadow: 0 0 0 2.5px var(--gold), 0 3px 10px rgba(0, 0, 0, .25); cursor: pointer; }
#goal b { color: var(--sign); margin-left: 4px; white-space: nowrap; }
#goal:hover { transform: translateY(-1px); }
#goal:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.goal-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid rgba(255, 255, 255, .12); }
.goal-row i { flex: none; width: 24px; text-align: center; font-style: normal; font-weight: 900; }
.goal-row div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.goal-row small { opacity: .8; font-weight: 600; margin-top: 2px; }
.goal-row span { font-weight: 800; color: var(--gold); }
.goal-row.done { opacity: .5; } .goal-row.done b { text-decoration: line-through; }
.goal-row.next { background: rgba(242, 194, 48, .14); border-radius: 8px; }
@media (max-width: 640px) { #goal { top: 64px; left: 10px; font-size: 12px; } }

/* ---------- phones & tablets ---------- */
#chat-toggle { display: none; }
#kicked { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(10, 20, 16, .72); }
#kicked .sign { width: min(440px, 100%); }
#hud > * { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
@media (pointer: coarse) {
  html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game canvas { touch-action: none; }
  #loc { top: calc(10px + var(--st)); left: calc(10px + var(--sl)); }
  #goal { top: calc(64px + var(--st)); left: calc(10px + var(--sl)); }
  #topright { top: calc(10px + var(--st)); right: calc(10px + var(--sr)); }
  #topright button { width: 46px; height: 46px; }
  #joy { display: block; left: calc(22px + var(--sl)); bottom: calc(26px + var(--sb)); width: 128px; height: 128px; }
  #joy i { left: 42px; top: 42px; }
  #needs { right: calc(10px + var(--sr)); bottom: calc(10px + var(--sb)); width: 122px; padding: 7px 8px; gap: 3px; }
  #needs .need i { font-size: 13px; }
  #chat-toggle { display: grid; place-items: center; position: fixed; left: calc(166px + var(--sl)); bottom: calc(30px + var(--sb)); width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--white); background: var(--sign); color: var(--white); font-size: 20px; box-shadow: 0 0 0 3px var(--sign); }
  #chat-toggle[data-n]:not([data-n=""])::after { content: attr(data-n); position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
  #chat { left: calc(10px + var(--sl)); bottom: calc(90px + var(--sb)); width: min(420px, calc(100vw - 20px)); z-index: 5; }
  #chat.collapsed { display: none; }
  #chat-input { font-size: 16px; }   /* stops iOS zooming into the field */
  #prompt { bottom: calc(190px + var(--sb)); font-size: 17px; padding: 12px 18px 10px 12px; }
  #prompt kbd { display: none; }
  #prompt::before { content: '👆'; margin-right: 2px; }
  #activity { top: calc(110px + var(--st)); }
  #wp-arrow { top: calc(150px + var(--st)); }
  .auth-card input, .modal input, #modal input { font-size: 16px; }
  #modal .sign { max-height: calc(100dvh - 24px - var(--st) - var(--sb)); }
}
@media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
  #goal { top: calc(10px + var(--st)); left: calc(190px + var(--sl)); }
  #needs { grid-template-columns: 1fr 1fr; width: 200px; }
  #prompt { bottom: calc(40px + var(--sb)); }
  #activity { top: calc(60px + var(--st)); }
  #chat { bottom: calc(10px + var(--sb)); left: calc(230px + var(--sl)); width: min(340px, 40vw); }
  #chat-log { height: 90px; }
  #chat-toggle { left: calc(160px + var(--sl)); bottom: calc(20px + var(--sb)); }
}

/* ================= toy-box finish: rounder, puffier, with a little depth =================
   Same freeway-sign green and white inset border, but every panel is a chunky rounded tile with a
   darker "extrusion" underneath and a soft highlight on top, and buttons press down when tapped. */
:root { --display: "Fredoka", "Overpass", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --lip: #003D2D; --gold-deep: #B88A10; }
#loc-name, .sign-head h2, .title-sign h1, #money, .apps button, .go, .sign button, .app button, #prompt, .act-text strong, h3 { font-family: var(--display); }
.sign, #loc, #activity, .title-sign {
  border-radius: 20px; border-width: 3px;
  box-shadow: 0 0 0 4px var(--sign), 0 7px 0 4px var(--lip), inset 0 3px 0 rgba(255, 255, 255, .22), 0 18px 34px rgba(0, 0, 0, .35);
}
#loc { padding: 6px 15px 7px; min-width: 0; border-radius: 16px; }
#loc-name { font-weight: 700; font-size: 20px; letter-spacing: 0; }
#clock { font-size: 13px; }
/* money: a gold coin-pill */
#money { border-radius: 999px; border: 0; padding: 6px 16px 5px; font-weight: 700; font-size: 19px; min-width: 0;
  background: linear-gradient(#FFD95A, var(--gold)); box-shadow: 0 4px 0 var(--gold-deep), inset 0 2px 0 rgba(255, 255, 255, .6), 0 8px 16px rgba(0, 0, 0, .25); }
#money.neg { background: linear-gradient(#FF5A5F, var(--red)); box-shadow: 0 4px 0 #8C0A10, inset 0 2px 0 rgba(255, 255, 255, .4); }
/* round toy buttons */
#topright { gap: 10px; }
#topright button { width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--white); font-size: 18px;
  background: radial-gradient(circle at 35% 30%, #13936E, var(--sign) 60%); box-shadow: 0 4px 0 var(--lip), 0 8px 14px rgba(0, 0, 0, .3); transition: transform .08s, box-shadow .08s; }
#topright button:active, #chat-toggle:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lip); }
/* compact interact pill */
#prompt { bottom: 21%; gap: 7px; padding: 4px 13px 4px 5px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink);
  background: linear-gradient(#FFFFFF, #EEF5F1); box-shadow: 0 4px 0 #B9CFC4, 0 8px 18px rgba(0, 0, 0, .28); transition: transform .08s; }
#prompt:active { transform: translate(-50%, 3px); }
#prompt kbd { border-radius: 999px; padding: 2px 8px 1px; font-size: 12px; font-family: var(--display); box-shadow: 0 2px 0 var(--lip); }
/* life checklist chip */
#goal { border-radius: 999px; padding: 5px 12px 5px; font-size: 12.5px; font-weight: 600; box-shadow: 0 0 0 2px var(--gold), 0 4px 0 var(--gold-deep), 0 8px 14px rgba(0, 0, 0, .22); }
#goal b { font-family: var(--display); font-weight: 700; }
/* needs: a soft tray with pill gauges */
#needs { border-radius: 18px; background: rgba(20, 34, 28, .78); box-shadow: 0 5px 0 rgba(0, 0, 0, .35), inset 0 2px 0 rgba(255, 255, 255, .08); backdrop-filter: blur(6px); }
.need b { height: 10px; border-radius: 999px; box-shadow: inset 0 2px 2px rgba(0, 0, 0, .35); }
.need s { border-radius: 999px; background: linear-gradient(#6FE6AE, var(--ok)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45); }
.need.low s { background: linear-gradient(#FFE07A, var(--gold)); } .need.crit s { background: linear-gradient(#FF7A7E, var(--red)); }
/* chat */
#chat { border-radius: 18px; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); backdrop-filter: blur(6px); }
.chat-tabs button { border-radius: 999px; padding: 3px 11px 2px; }
#chat-input { border-radius: 0 0 18px 18px; }
#chat-toggle { width: 40px !important; height: 40px !important; font-size: 17px !important; border-width: 2px !important;
  background: radial-gradient(circle at 35% 30%, #13936E, var(--sign) 60%) !important; box-shadow: 0 4px 0 var(--lip), 0 8px 14px rgba(0, 0, 0, .3) !important; transition: transform .08s; }
/* activity bar + toasts */
#activity { border-radius: 18px; }
#activity button { border-radius: 999px; box-shadow: 0 3px 0 #B9CFC4; }
.toast { border-radius: 14px; border-left: 0; box-shadow: inset 5px 0 0 var(--white), 0 4px 0 rgba(0, 0, 0, .3), 0 8px 18px rgba(0, 0, 0, .3); }
.toast.ok { box-shadow: inset 5px 0 0 var(--ok), 0 4px 0 rgba(0, 0, 0, .3), 0 8px 18px rgba(0, 0, 0, .3); }
.toast.err { box-shadow: inset 5px 0 0 var(--red), 0 4px 0 rgba(0, 0, 0, .3), 0 8px 18px rgba(0, 0, 0, .3); }
/* panels and their buttons */
.sign-head h2 { font-weight: 700; }
.sign button, .app button, .phone button:not(.exit-tab):not(.back) { border-radius: 999px; font-weight: 600; padding: 6px 14px 5px; box-shadow: 0 3px 0 #B9CFC4; transition: transform .08s, box-shadow .08s; }
.sign button:active, .app button:active { transform: translateY(2px); box-shadow: 0 1px 0 #B9CFC4; }
.sign button.ghost, .app button.ghost { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .7), 0 3px 0 rgba(0, 0, 0, .25); }
.sign button.wide, .app button.wide { padding: 11px; }
.exit-tab { border-radius: 12px 12px 0 0; font-family: var(--display); font-weight: 600; }
input[type=number], input[type=text], select { border-radius: 999px; padding: 6px 12px 5px; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .18); }
.row.mine, .cloth, .goal-row.next { border-radius: 14px; }
/* phone */
.phone { border-radius: 38px; border-width: 7px; box-shadow: 0 8px 0 #050607, 0 26px 60px rgba(0, 0, 0, .5); }
.apps i { border-radius: 22px; background: radial-gradient(circle at 35% 25%, #16A07A, var(--sign) 65%); border: 2.5px solid rgba(255, 255, 255, .9); box-shadow: 0 5px 0 var(--lip), 0 10px 16px rgba(0, 0, 0, .3); transition: transform .08s, box-shadow .08s; }
.phone .apps button:active i { transform: translateY(3px); box-shadow: 0 2px 0 var(--lip); }
.apps em { border-radius: 999px; }
/* sign-in */
.title-sign h1 { font-weight: 700; }
.go { border-radius: 999px; font-family: var(--display); font-weight: 700; box-shadow: 0 0 0 3px var(--sign), 0 0 0 5.5px var(--white), 0 8px 0 5px var(--lip); }
.go:active { transform: translateY(3px); }
.creator { border-radius: 20px; }
.sw button { box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
/* joystick: a rubbery thumb pad */
#joy { background: radial-gradient(circle, rgba(255, 255, 255, .06), rgba(255, 255, 255, .18)); border: 3px solid rgba(255, 255, 255, .55); box-shadow: 0 5px 0 rgba(0, 0, 0, .25); }
#joy i { background: radial-gradient(circle at 35% 30%, #FFFFFF, #DCE8E2); box-shadow: 0 4px 0 #9DB5A9, 0 6px 10px rgba(0, 0, 0, .3); }
@media (pointer: coarse) {
  #prompt { font-size: 14px; padding: 6px 14px 6px 10px; bottom: calc(176px + var(--sb, 0px)); }
  #prompt::before { content: ''; }
}
/* in-world labels: small round name chips and compact speech bubbles */
.tag-name { font: 600 11px var(--display); background: rgba(20, 34, 28, .55); padding: 1px 7px 1px; border-radius: 999px; text-shadow: none; }
.tag-name.me { color: #FFE07A; }
.tag-bubble { font: 500 12px/1.3 var(--display); padding: 4px 9px 4px; border-radius: 14px; max-width: 170px; box-shadow: 0 3px 0 #C9D8D0, 0 6px 12px rgba(0, 0, 0, .25); }
.phone .apps button { background: transparent !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; color: var(--white) !important; font-weight: 600 !important; }
.app button.chip { background: rgba(255, 255, 255, .1) !important; color: var(--white) !important; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .35) !important; }
.app button.chip.on { background: var(--white) !important; color: var(--sign) !important; box-shadow: 0 3px 0 #B9CFC4 !important; }

/* billboard auctions */
.ad-card { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(255, 255, 255, .07); border-radius: 14px; padding: 10px; margin: 8px 0; }
.ad-prev { width: 128px; aspect-ratio: 896 / 364; border-radius: 6px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 3px #2A2C30, 0 4px 0 3px rgba(0, 0, 0, .25); flex: none; }
.ad-prev.sz-S { width: 54px; aspect-ratio: 256 / 394; }
.ad-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad-prev b { color: #fff; font-size: 12px; padding: 4px; text-align: center; text-shadow: 0 1px 0 rgba(0, 0, 0, .5); }
.ad-info { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 4px; }
.ad-info small { opacity: .8; }
.ad-edit { flex-basis: 100%; display: flex; flex-direction: column; gap: 6px; }
.ad-bid { background: rgba(255, 255, 255, .06); border-radius: 12px; padding: 2px 10px; margin: -4px 0 8px; }
.app label.filebtn { display: inline-block; background: var(--white); color: var(--sign); border-radius: 999px; padding: 6px 14px 5px; font: 600 14px var(--display); box-shadow: 0 3px 0 #B9CFC4; cursor: pointer; }
.app label.filebtn input { display: none; }

/* coin store */
.coin-hero { display: flex; align-items: center; gap: 12px; background: linear-gradient(180deg, #F7D774, #E9B93A); color: #3A2A06; border-radius: 16px; padding: 12px 16px; margin: 4px 0 10px; box-shadow: 0 4px 0 #B88A1C; }
.coin-hero i { font-style: normal; font-size: 34px; }
.coin-hero b { display: block; font: 700 24px var(--display); }
.coin-hero small { opacity: .75; }
.packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 12px; }
.app button.pack { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border-radius: 14px; position: relative; }
.app button.pack b { font-size: 14px; }
.app button.pack span { font: 600 12px var(--body, inherit); opacity: .8; }
.app button.pack em { position: absolute; top: -6px; right: -4px; background: #E2463A; color: #fff; font: 700 10px var(--display); font-style: normal; padding: 2px 6px; border-radius: 999px; }
.app button.pack[disabled] { opacity: .5; }
.test-pill { color: #F2C230; }

/* Match (swipe app) */
.m-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 2px 0 8px; font-size: 13px; opacity: .9; }
.m-matches { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; }
.app .m-matches button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 10px; border-radius: 16px; position: relative; font-size: 12px; }
.m-matches button i { font-style: normal; font-size: 20px; }
.m-matches button em { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: #3ECF8E; box-shadow: 0 0 0 2px #fff; }
.mstack { position: relative; height: min(400px, 50vh); min-height: 330px; margin: 4px auto 10px; max-width: 340px; touch-action: pan-y; }
.mcard { position: absolute; inset: 0; background: #FFFDF8; color: #24262B; border-radius: 24px; overflow: hidden; box-shadow: 0 6px 0 #D9CDB8, 0 14px 28px rgba(0, 0, 0, .35); cursor: grab; user-select: none; touch-action: none; }
.mcard.under { transform: scale(.94) translateY(14px); opacity: .7; box-shadow: 0 6px 0 #D9CDB8; }
.m-photo { position: relative; height: 46%; background: radial-gradient(circle at 50% 35%, #FFF3D6, #FDD7E2 60%, #F7B6C8); display: grid; place-items: center; }
.m-photo canvas { position: absolute; left: 50%; top: 3%; height: 94%; width: auto; aspect-ratio: 240 / 250; transform: translateX(-50%); }
.stamp { position: absolute; top: 18px; font: 700 26px var(--display); padding: 2px 10px; border: 4px solid; border-radius: 10px; opacity: 0; transition: opacity .1s; }
.stamp.like { left: 16px; color: #2FA866; transform: rotate(-14deg); }
.stamp.nope { right: 16px; color: #E2463A; transform: rotate(14deg); }
.mcard.liking .stamp.like, .mcard.noping .stamp.nope { opacity: 1; }
.m-info { padding: 10px 16px; overflow: hidden; }
.m-info h3 { margin: 0; font: 700 22px var(--display); color: #24262B; border: 0; padding: 0; }
.m-info small { color: #6A6F78; }
.m-info p { margin: 6px 0; font-size: 14px; line-height: 1.35; }
.m-tags, .m-wants { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.m-tags span { background: #EFEAE0; border-radius: 999px; padding: 3px 9px; font-size: 12px; }
.m-tags span.same { background: #FFE08A; font-weight: 700; }
.m-wants b { background: #FDE3EA; color: #B83262; border-radius: 999px; padding: 3px 9px; font-size: 12px; }
.m-btns { display: flex; justify-content: center; gap: 28px; margin: 6px 0; }

/* ===================== in-game HUD (gameplay concept): light cream cards, navy type, 3D prop pictures ===================== */
img.ic { object-fit: contain; vertical-align: middle; }
:root { --hud: rgba(255, 252, 246, .96); --hud-line: #F2E6DA; --hud-text: var(--bb-navy); --hud-sub: #6B7396; --hud-shadow: 0 2px 0 rgba(232, 214, 200, .55), 0 8px 22px rgba(120, 90, 80, .12);
  --pc: #FFFBF3; --pc-line: #EFE1CF; --pc-dash: #E2CDB4; --pc-tape1: rgba(166, 214, 242, .72); --pc-tape2: rgba(246, 176, 200, .72); --pc-ink: rgba(104, 118, 168, .62); }
#loc, #goal, #needs, #dock, #hint, #life-shop, #money, #topright button, #chat-toggle, #chat { border: 1.5px solid var(--hud-line) !important; box-shadow: var(--hud-shadow) !important; font-family: var(--bb-font); }
#loc { top: 12px; left: 12px; gap: 8px; padding: 6px 26px 6px 8px; border-radius: 18px; background: var(--hud); }
#loc-ic { width: 40px; height: 40px; background: none; border-radius: 0; } #loc-ic .ic { width: 40px; height: 40px; }
#loc-name { font: 800 19px/1.15 var(--bb-font); color: var(--hud-text); }
#clock { font: 700 11.5px/1.25 var(--bb-font); color: var(--hud-sub); }
#goal { top: 74px; left: 12px; gap: 8px; padding: 6px 10px 6px 8px !important; border-radius: 18px !important; background: var(--hud) !important; max-width: 300px; }
#goal .gl-ic { width: 36px; height: 36px; background: none; border-radius: 0; } #goal .gl-ic .ic { width: 36px; height: 36px; }
#goal span { flex: 1; min-width: 0; }
#goal b { font: 800 13.5px/1.2 var(--bb-font); color: var(--hud-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#goal small { font: 700 11px/1.25 var(--bb-font); color: var(--hud-sub); }
#goal em { gap: 2px; margin-left: 6px; padding: 2px 9px 2px 4px; border-radius: 999px; background: #FFF0C4; border: 1px solid #F5DB8E; color: var(--hud-text); font: 800 12.5px var(--bb-font); }
#goal em .ic { width: 18px; height: 18px; }
#topright { top: 12px; right: 12px; gap: 8px; align-items: center; }
#money { height: 42px; box-sizing: border-box; gap: 4px; padding: 0 16px 0 5px; border-radius: 999px; background: linear-gradient(180deg, #FFF6D6, #FFEAA8); border-color: #F6DA8C !important; color: var(--hud-text); font: 800 19px var(--bb-font); }
#money .ic { width: 30px; height: 30px; }
#money.neg { background: #FFE9EE; color: #C2405E; }
#topright button { width: 44px; height: 44px; box-sizing: border-box; border-radius: 15px; background: rgba(255, 250, 246, .78); display: grid; place-items: center; padding: 0; backdrop-filter: blur(4px); }
#topright button .ic { width: 32px; height: 32px; }
#topright #mood-btn { background: rgba(250, 226, 236, .82); }
#topright button:hover { transform: translateY(-1px); background: #FFFCF6; } #topright button:active { transform: translateY(2px); }
#needs { top: 66px; right: 12px; width: 178px; box-sizing: border-box; padding: 8px 12px 10px; gap: 4px; border-radius: 18px; background: var(--hud); }
.st-head { margin-bottom: 1px; } .st-head b { font: 700 12px var(--bb-font); color: var(--hud-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-head .ic { width: 24px; height: 24px; flex: none; }
#needs .need { grid-template-columns: 20px auto 1fr; gap: 6px; }
#needs .need .ic { width: 20px; height: 20px; }
#needs .need span { font: 800 11.5px var(--bb-font); color: var(--hud-text); min-width: 44px; }
#needs .need b { height: 5px; border-radius: 999px; background: #EFEAE6; box-shadow: none; }
#needs .need s { border-radius: 999px; background: #6CC79A; }
#needs .need.energy s { background: #F2C64E; }
#needs .need.mood s, #needs .need.fun s { background: #EE8FAE; }
#needs .need.low s { background: #F4A54A; } #needs .need.crit s { background: var(--bb-red); }
#dock { bottom: 12px; gap: 2px; padding: 5px 8px; border-radius: 22px; background: var(--hud); }
#dock button { width: 60px; padding: 4px 0 3px; border-radius: 16px; color: var(--hud-text); font: 800 12px var(--bb-font); gap: 1px; }
#dock button .ic { width: 36px; height: 36px; }
#dock button:hover { background: #FBF1EC; }
#dock button.on { background: linear-gradient(180deg, #E4F4FE, #CBE9FB); box-shadow: inset 0 0 0 1.5px #A9D8F4; color: #24427F; }
#hint { left: 12px; bottom: 12px; gap: 6px; padding: 5px 14px 5px 7px; border-radius: 999px; background: var(--hud); color: var(--hud-text); font: 800 11.5px var(--bb-font); letter-spacing: 0; }
#hint .ic { width: 22px; height: 22px; }
#life-shop { right: 12px; bottom: 12px; gap: 6px; padding: 5px 16px 5px 7px; border-radius: 16px; background: var(--hud); color: var(--hud-text); font: 800 13px var(--bb-font); }
#life-shop .ic { width: 30px; height: 30px; }
#prompt { font-family: var(--bb-font); }

/* ---------- postcard dressing, shared by the chat, dialogs, the player card and confirm windows ---------- */
.pc { position: relative; }
.pc-tape { position: absolute; z-index: 3; width: 58px; height: 18px; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .28) 0 3px, transparent 3px 7px), var(--pc-tape1);
  clip-path: polygon(0 8%, 4% 0, 96% 0, 100% 10%, 97% 30%, 100% 50%, 97% 70%, 100% 90%, 96% 100%, 4% 100%, 0 92%, 3% 70%, 0 50%, 3% 30%); }
.pc-tape.a { left: -16px; top: 6px; transform: rotate(-38deg); }
.pc-tape.b { right: -16px; bottom: 8px; transform: rotate(-38deg); background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .28) 0 3px, transparent 3px 7px), var(--pc-tape2); }
.pc-stamp { position: absolute; z-index: 2; top: 8px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--pc-ink); display: grid; place-items: center; transform: rotate(-12deg); pointer-events: none;
  outline: 1px dashed var(--pc-ink); outline-offset: -5px; }
.pc-stamp b { font: 800 10px/1 var(--bb-font); color: var(--pc-ink); letter-spacing: .02em; }
.pc-stamp::after { content: ""; position: absolute; left: -18px; top: 50%; width: 16px; height: 8px; margin-top: -4px; border-top: 1.5px solid var(--pc-ink); border-bottom: 1.5px solid var(--pc-ink); border-radius: 50%; opacity: .7; }
/* dialogs (shop / clerk / place windows, the player card) */
.sign.pc { overflow: visible; }
.sign.pc::after { content: ""; position: absolute; inset: 9px; border: 2px dashed rgba(226, 178, 198, .85); border-radius: 28px; pointer-events: none; z-index: 1; }
.sign.pc > .sign-head, .sign.pc > .sign-body { position: relative; z-index: 2; }
.sign.pc .pc-tape { width: 74px; height: 22px; } .sign.pc .pc-tape.a { left: -30px; top: 2px; } .sign.pc .pc-tape.b { right: -24px; bottom: 10px; }
.sign.pc .pc-stamp { top: 20px; right: 84px; width: 44px; height: 44px; opacity: .8; z-index: 3; } .sign.pc .pc-stamp b { font-size: 12px; }
.bb-confirm.pc::after { content: ""; position: absolute; inset: 8px; border: 2px dashed rgba(226, 178, 198, .85); border-radius: 26px; pointer-events: none; }
.bb-confirm .pc-stamp { top: 12px; right: 16px; width: 42px; height: 42px; } .bb-confirm .pc-stamp b { font-size: 12px; }
.bb-confirm > *:not(.pc-tape):not(.pc-stamp) { position: relative; z-index: 2; }

/* ---------- chat postcard ---------- */
#chat { left: 12px; bottom: 98px; width: min(250px, calc(100vw - 24px)); border-radius: 16px; background: var(--pc) !important; border-color: var(--pc-line) !important; color: var(--hud-text); backdrop-filter: none; overflow: visible; }
#chat .pc-stamp { top: 7px; right: 9px; width: 26px; height: 26px; outline-offset: -4px; } #chat .pc-stamp b { font-size: 8.5px; } #chat .pc-stamp::after { display: none; }
#chat .pc-tape.a { left: -14px; top: -2px; } #chat .pc-tape.b { right: -14px; bottom: -4px; }
.chat-tabs { align-items: center; gap: 4px; margin: 0; padding: 8px 40px 6px 10px; border: 0; }
.chat-badge { width: 24px; height: 24px; flex: none; margin-right: 4px; border-radius: 50%; background: #F9E6EC; border: 1.5px solid #F0D2DC; display: flex; align-items: center; justify-content: center; gap: 2px; }
.chat-badge s { width: 3.5px; height: 3.5px; border-radius: 50%; background: #C98AA2; text-decoration: none; }
.chat-tabs button { border-radius: 999px; padding: 3px 12px; color: var(--hud-sub); font: 800 12px var(--bb-font); background: transparent; }
.chat-tabs button.on { background: #FADCE6; color: #B24A73; box-shadow: inset 0 0 0 1px #F3C3D3; }
#chat-log { box-sizing: border-box; height: 92px; margin: 0 10px 8px; padding: 6px 10px; border: 1.5px dashed var(--pc-dash); border-radius: 10px; background: #FFFDF8; color: var(--hud-text); font: 600 12px/1.35 var(--bb-font); }
#chat .msg { margin: 0 0 6px; } #chat .msg:last-child { margin-bottom: 0; }
#chat .msg b { display: inline-block; margin: 0 4px 0 0; font: 800 11.5px var(--bb-font); color: #3E86C2; }
#chat .msg span.raw { display: block; color: var(--hud-text); }
#chat .msg.who1 b { color: #C9578A; } #chat .msg.who2 b { color: #2E9A93; } #chat .msg.who3 b { color: #8A63C9; }
#chat .msg i { background: #E4F4FE; color: #3E86C2; font-size: 10px; border-radius: 999px; padding: 0 6px; }
#chat .msg.news span { color: #A7801C; }
.chat-field { position: relative; margin: 0 10px 10px; }
#chat-input { box-sizing: border-box; width: 100%; margin: 0; border: 1.5px solid #D9E7F2 !important; border-radius: 10px; background: #fff; color: var(--hud-text); font: 600 12px var(--bb-font); padding: 6px 34px 6px 10px; }
#chat-input::placeholder { color: #8A90AA; }
#chat-input:focus { outline: none; border-color: var(--bb-focus) !important; }
.chat-enter { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 22px; height: 18px; padding: 0; border: 1px solid #BFE0F5; border-radius: 6px; background: #E4F4FE; color: #3E86C2; display: grid; place-items: center; cursor: pointer; }
.chat-enter svg { width: 13px; height: 13px; }
#chat-toggle { left: 12px; bottom: 50px; width: 36px; height: 36px; border-radius: 50% !important; background: var(--pc) !important; display: grid !important; place-items: center; padding: 0; }
#chat-toggle::before { content: ""; position: absolute; left: 7px; top: 8px; width: 22px; height: 16px; border-radius: 9px; background: #F9E6EC; border: 1.5px solid #F0D2DC; box-sizing: border-box; }
#chat-toggle i { position: relative; z-index: 1; display: inline-block; width: 3.5px; height: 3.5px; margin: 0 1px; border-radius: 50%; background: #C98AA2; transform: translateY(-2px); }
#chat-toggle { display: flex !important; align-items: center; justify-content: center; }
#chat-toggle:hover { background: #FFFDF8 !important; }

/* ---------- name tags, speech balloons, the player pill ---------- */
.tag-name { background: rgba(255, 252, 246, .94); color: var(--bb-navy); font: 800 11px var(--bb-font); padding: 2px 9px; border-radius: 999px; text-shadow: none; box-shadow: 0 1px 0 rgba(220, 200, 185, .8), 0 2px 6px rgba(60, 40, 40, .15); border: 1px solid #F2E6DA; }
.tag-name.me { color: #C9578A; }
.tag-bubble { background: var(--pc); color: var(--bb-navy); font: 700 12px/1.35 var(--bb-font); border: 1.5px solid var(--pc-line); border-radius: 14px; padding: 6px 11px; box-shadow: inset 0 0 0 3px var(--pc), inset 0 0 0 4.5px rgba(226, 205, 180, .9), 0 3px 10px rgba(60, 40, 40, .18); }
.tag-bubble::after { border-top-color: var(--pc); }
.pp-wrap { pointer-events: none; }
.pp { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 4px 6px; transform: translateY(46px); border-radius: 14px; background: var(--pc); border: 1.5px solid var(--pc-line); box-shadow: inset 0 0 0 2.5px var(--pc), inset 0 0 0 4px rgba(226, 205, 180, .8), 0 6px 16px rgba(60, 40, 40, .2); font-family: var(--bb-font); white-space: nowrap; }
.pp kbd { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: #E4F4FE; border: 1px solid #BFE0F5; color: var(--bb-navy); font: 800 11px var(--bb-font); margin: 0 2px; }
.pp button { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 5px; border: 0; border-radius: 10px; background: transparent; color: var(--bb-navy); font: 800 12.5px var(--bb-font); cursor: pointer; }
.pp button .ic { width: 22px; height: 22px; }
.pp button:hover { background: #FBF0EB; }
.pp .pp-chat { background: #FADCE6; box-shadow: inset 0 0 0 1px #F3C3D3; }

/* ===================== rotate-your-phone (portrait phones) ===================== */
#rotate { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;
  background: radial-gradient(ellipse at 50% 35%, #FFF6FA, #FBDDE8); font-family: var(--bb-font); color: var(--bb-navy); }
#rotate .bb-word { font-size: clamp(30px, 10vw, 48px); }
#rotate svg { width: 130px; height: 130px; }
#rotate p { margin: 0; font: 800 20px/1.35 var(--bb-font); max-width: 300px; }
#rotate .rot-phone { transform-origin: 50% 50%; animation: bb-rot 2.4s var(--bb-ease) infinite; }
@keyframes bb-rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { #rotate .rot-phone { animation: none; transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 820px) and (pointer: coarse) { #rotate { display: flex; } }

/* ===================== desktop sizes between phone and full HD ===================== */
@media (max-width: 1400px) {
  .bb-shophead .bb-word.shop { font-size: 66px; top: -52px; } .bb-shophead .bb-sub { font-size: 22px; top: 30px; }
  .bb-shop .mall-body { grid-template-columns: 190px minmax(0, 1fr) 330px; }
  .bb-shop .mcats button { font-size: 19px; } .bb-shop .mtile b { font-size: 18px; } .bb-shop .mdetail h3 { font-size: 32px; } .bb-shop .mbig .ic { width: 180px; height: 180px; }
  #build-top .bb-word.build { font-size: 52px; }
}

/* ===================== phones and small windows in landscape: everything shrinks to fit the height, nothing scrolls the page ===================== */
@media (max-height: 520px) and (orientation: landscape) {
  .bb-word { font-size: 34px; } .bb-sub { font-size: 14px; gap: 8px; } .bb-sub i { width: 22px; }
  .bb-label { font-size: 13px; margin: 6px 2px 3px; }
  .bb-field { font-size: 14px !important; padding: 7px 12px !important; border-radius: 12px !important; }
  .bb-btn { font-size: 14px; padding: 7px 16px; gap: 6px; } .bb-btn.big { font-size: 16px; padding: 8px 14px; } .bb-btn .bb-arr { width: 16px; height: 16px; } .bb-btn.sq { width: 36px; height: 36px; border-radius: 12px; }
  .bb-check { font-size: 13px; } .bb-check i { width: 20px; height: 20px; } .bb-link { font-size: 13px; }
  .bb-coin { font-size: 13px; padding: 2px 12px 2px 3px; } .bb-coin .bb-coinic { width: 18px; height: 18px; } .bb-coin.big { font-size: 16px; padding: 2px 14px 2px 3px; } .bb-coin.big .bb-coinic { width: 24px; height: 24px; }
  .bb-chip { font-size: 12px; padding: 3px 10px; }
  .bb-step { font-size: 13px; padding: 3px 14px 3px 3px; gap: 6px; } .bb-step b { width: 22px; height: 22px; font-size: 12px; } .bb-step b svg { width: 14px; height: 14px; } .bb-line { width: 26px; height: 3px; }
  .bb-steps { margin-top: 4px; }
  /* sign-in cards: card on the right, scrolls inside itself when the screen is very short */
  #auth.bb-on { overflow: hidden; }
  .bb-auth.bb-login { height: 100vh; height: 100dvh; min-height: 0; }
  .bb-brand { width: 56%; top: max(6px, env(safe-area-inset-top)); left: max(0px, env(safe-area-inset-left)); } .bb-brand .bb-word.logo { font-size: clamp(26px, 5vw, 46px); } .bb-brand .bb-sub { font-size: 13px; }
  .bb-langdd select { min-width: 100px; font-size: 13px; padding: 4px 30px 4px 12px; background-position: right 10px center; background-size: 10px; }
  .bb-authcard { position: absolute; top: 34px; bottom: max(6px, env(safe-area-inset-bottom)); right: max(10px, env(safe-area-inset-right)); margin: 0; width: min(380px, 44vw); min-width: 0; padding: 10px 18px 10px; border-radius: 26px; border-width: 3px; overflow-y: auto; scrollbar-width: none; }
  .bb-authcard > .bb-word.card { font-size: 32px; margin: -2px -10px 0; } .bb-authcard > .bb-word.card.stack { margin-top: 0; font-size: 28px; }
  .bb-serif { font-size: 15px; margin: 2px 0 4px; }
  .bb-row { margin: 6px 2px 0; } .bb-alt { font-size: 13px; margin-top: 6px; } .bb-or { margin: 6px 0; font-size: 12px; } .bb-legal { margin-top: 6px; } .bb-legal .bb-link { font-size: 12px; }
  .bb-google svg { width: 20px; height: 20px; } .bb-google { font-size: 14px !important; }
  .bb-msg { font-size: 13px; margin-top: 6px; } .bb-msg.strong { font-size: 14px; } .bb-envelope { width: 60px; } .bb-masked { font-size: 15px; padding: 5px 10px; margin-top: 4px; } .bb-authcard .bb-btn.big { margin-top: 8px; }
  .bb-note { font-size: 12px; padding: 5px 10px; } .bb-err { font-size: 12px; }
  /* creator: one panel that fills the screen; the middle scrolls inside */
  .bb-create { height: 100vh; height: 100dvh; box-sizing: border-box; padding: 22px max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  .bb-panel.bb-cc { height: 100%; padding: 0 14px 8px; border-radius: 24px; border-width: 3px; }
  .bb-cchead { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .bb-cchead .bb-word.title { font-size: 28px; margin: -18px 0 0; flex-basis: 100%; }
  .bb-cchead .bb-sub { display: none; }
  .bb-ccmain { padding: 6px 0 4px; overflow-y: auto; scrollbar-width: none; }
  .bb-foot { gap: 10px; padding-top: 4px; } .bb-foot .bb-btn { font-size: 14px; padding: 7px 16px; } .bb-foot .bb-btn.white { min-width: 0; } .bb-foot #a-go { min-width: 0; }
  .bb-hint { font-size: 11px; gap: 8px; }
  .bb-chibi { display: none; } .bb-create.has-chibi .bb-panel.bb-cc { width: 100%; } .bb-create.has-chibi .bb-foot { padding-left: 0; padding-right: 0; }
  #auth .bb-cc .cc-s1 { height: 100%; min-height: 0; grid-template-columns: minmax(0, .9fr) minmax(0, .7fr) minmax(0, 1.2fr); grid-template-areas: "left center right"; align-items: stretch; gap: 10px; }
  #auth .bb-cc .cc-bub { border-radius: 16px; padding: 6px; }
  #auth .bb-cc .cc-left { gap: 6px; } #auth .bb-cc .cc-presets { gap: 6px; }
  #auth .bb-cc .cc-preset { padding: 4px; border-radius: 14px; } #auth .bb-cc .cc-preset-tag { font-size: 11px; padding: 3px 0; border-radius: 9px; } #auth .bb-cc .cc-preset-pic { margin-top: 2px; transform: none; }
  #auth .bb-cc .cc-name { padding: 6px; gap: 6px; } #auth .bb-cc .cc-name .cc-label { font-size: 11px; } #auth .bb-cc .cc-name .bb-btn.sm { padding: 0 8px; font-size: 12px; }
  #auth .bb-cc .cc-stagebox { max-height: calc(100% - 44px); }
  #auth .bb-cc .cc-turn { margin-top: 2px; gap: 8px; font-size: 12px; }
  #auth .bb-cc .cc-tabs2 { gap: 4px; } #auth .bb-cc .cc-pill { font-size: 12px; padding: 4px 0; }
  #auth .bb-cc .cc-body { margin-top: 6px; }
  #auth .bb-cc .cc-grid.heads { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-bottom: 6px; }
  #auth .bb-cc .cc-grid.heads .cc-tile { padding: 2px; border-radius: 12px; }
  #auth .bb-cc .cc-wells { gap: 5px; } #auth .bb-cc .cc-well { padding: 4px 6px; border-radius: 12px; } #auth .bb-cc .cc-well.row { gap: 6px; } #auth .bb-cc .cc-well.row .cc-dot, #auth .bb-cc .cc-well .cc-dot { width: 22px; height: 22px; }
  .bb-nbgrid { gap: 8px 10px; } .bb-nb { gap: 10px; padding: 6px 10px 6px 6px; border-radius: 16px; border-width: 2.5px; } .bb-nbtxt { gap: 4px; } .bb-nbtxt strong { font-size: 17px; } .bb-nbpic { border-radius: 10px; width: 50%; }
  .bb-tick { width: 26px; height: 26px; top: 4px; left: calc(50% - 20px); } .bb-tick svg { width: 16px; height: 16px; }
  .bb-infobar { margin: 8px auto 0; padding: 5px 14px; gap: 8px; border-radius: 14px; } .bb-infobar svg { width: 24px; height: 24px; } .bb-infobar b { font-size: 12px; } .bb-infobar small { font-size: 10px; }
  .bb-studio { grid-template-columns: minmax(0, 1fr) minmax(170px, 30%); gap: 10px; }
  .bb-plans { gap: 8px; } .bb-plancard { padding: 6px; gap: 4px; border-radius: 16px; border-width: 2.5px; } .bb-plantitle { font-size: 12px; gap: 5px; } .bb-radio { width: 18px; height: 18px; border-width: 2px; } .bb-radio svg { width: 12px; height: 12px; }
  .bb-plancard img { border-radius: 10px; } .bb-chips em { font-size: 10px; padding: 2px 6px; } .bb-chips { gap: 4px; }
